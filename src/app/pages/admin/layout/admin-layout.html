<!-- admin-layout.html -->
<div class="min-h-screen bg-gray-50 flex">
    <!-- Sidebar -->
    <aside class="w-64 bg-indigo-700 text-white shadow-md flex flex-col justify-between h-screen">
      <!-- Haut de la sidebar -->
      <div>
        <div class="p-4 flex items-center space-x-2 border-b border-indigo-600">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2z">
            </path>
          </svg>
          <span class="text-xl font-bold">ConfigurateurPC</span>
        </div>
  
        <nav class="p-4 space-y-1">
          <a routerLink="dashboard" routerLinkActive="bg-indigo-800"
            class="flex items-center space-x-2 p-2 rounded hover:bg-indigo-600 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z">
              </path>
            </svg>
            <span>Dashboard</span>
          </a>
  
          <!-- Composants -->
          <div class="group">
            <div
              class="flex items-center space-x-2 p-2 rounded hover:bg-indigo-600 transition-colors cursor-pointer">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4">
                </path>
              </svg>
              <span>Composants</span>
              <svg class="w-4 h-4 ml-auto transform group-hover:rotate-90 transition-transform" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 5l7 7-7 7"></path>
              </svg>
            </div>
            <div class="ml-6 mt-1 space-y-1 hidden group-hover:block">
              <a routerLink="composants" routerLinkActive="bg-indigo-800"
                class="block p-2 rounded hover:bg-indigo-600 transition-colors">Liste des composants</a>
              <a routerLink="composants/nouveau" routerLinkActive="bg-indigo-800"
                class="block p-2 rounded hover:bg-indigo-600 transition-colors">Ajouter un composant</a>
            </div>
          </div>
  
          <!-- Utilisateurs -->
          <a routerLink="utilisateurs" routerLinkActive="bg-indigo-800"
            class="flex items-center space-x-2 p-2 rounded hover:bg-indigo-600 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z">
              </path>
            </svg>
            <span>Utilisateurs</span>
          </a>
  
          <!-- Configurations -->
          <a routerLink="configurations" routerLinkActive="bg-indigo-800"
            class="flex items-center space-x-2 p-2 rounded hover:bg-indigo-600 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2z">
              </path>
            </svg>
            <span>Configurations</span>
          </a>
  
          <!-- Partenaires -->
          <div class="group">
            <div
              class="flex items-center space-x-2 p-2 rounded hover:bg-indigo-600 transition-colors cursor-pointer">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
                </path>
              </svg>
              <span>Partenaires</span>
              <svg class="w-4 h-4 ml-auto transform group-hover:rotate-90 transition-transform" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 5l7 7-7 7"></path>
              </svg>
            </div>
            <div class="ml-6 mt-1 space-y-1 hidden group-hover:block">
              <a routerLink="partenaires" routerLinkActive="bg-indigo-800"
                class="block p-2 rounded hover:bg-indigo-600 transition-colors">Liste des partenaires</a>
              <a routerLink="partenaires/nouveau" routerLinkActive="bg-indigo-800"
                class="block p-2 rounded hover:bg-indigo-600 transition-colors">Ajouter un partenaire</a>
            </div>
          </div>
        </nav>
      </div>
  
      <!-- Déconnexion en bas -->
      <div class="p-4 border-t border-indigo-600">
        <button (click)="logout()" class="w-full text-left px-4 py-2 text-sm text-white bg-indigo-600 rounded hover:bg-indigo-500">
          Déconnexion
        </button>
      </div>
    </aside>
  
    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <!-- Header -->
      <header class="bg-white shadow-sm">
        <div class="flex items-center justify-between p-4">
          <h1 class="text-xl font-semibold text-gray-800">
            {{ currentRouteTitle }}
          </h1>
  
          <div class="flex items-center space-x-4">
            <!-- Menu utilisateur -->
            <div class="relative">
              <button (click)="toggleDropdown()" class="flex items-center space-x-2 focus:outline-none">
                <div class="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center text-white">
                  {{ userInitials }}
                </div>
                <span class="text-gray-700">{{ userName }}</span>
              </button>
            </div>
          </div>
        </div>
      </header>
  
      <!-- Content -->
      <main class="flex-1 overflow-y-auto p-6 bg-gray-50">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
