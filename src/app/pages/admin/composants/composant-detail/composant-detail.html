<!-- composant-detail.html -->
<div class="p-6">
    <!-- Breadcrumb -->
    <nav class="flex mb-6" aria-label="Breadcrumb">
      <ol class="inline-flex items-center space-x-1 md:space-x-3">
        <li class="inline-flex items-center">
          <a routerLink="/admin/composants" class="inline-flex items-center text-sm font-medium text-gray-700 hover:text-indigo-600">
            <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20">
              <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path>
            </svg>
            Composants
          </a>
        </li>
        <li class="text-gray-500">/</li>
        <li class="text-gray-500">
          Détails du composant
        </li>
      </ol>
    </nav>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="flex justify-center items-center h-64">
      <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-indigo-500"></div>
    </div>

    <!-- Error State -->
    <div *ngIf="error && !isLoading" class="error-message bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
      {{ error }}
    </div>

    <!-- Component Detail -->
    <div *ngIf="component && !isLoading" class="bg-white shadow rounded-lg overflow-hidden">
      <div class="p-6">
        <div class="flex flex-col md:flex-row gap-8">
          <!-- Left Column - Component Info -->
          <div class="flex-1">
            <div class="flex items-center mb-6">
              <div class="flex-shrink-0 h-16 w-16">
                <img *ngIf="imageUrl" 
                     [src]="imageUrl" 
                     alt="Image du composant"
                     class="h-16 w-16 rounded-md object-contain border border-gray-200">
                <div *ngIf="!imageUrl" class="h-16 w-16 rounded-md bg-gray-100 flex items-center justify-center border border-gray-200">
                  <span class="text-gray-400 text-xl font-medium">{{ component.name | initials }}</span>
                </div>
              </div>
              <div class="ml-4">
                <h2 class="text-2xl font-bold text-gray-800">{{ component.name }}</h2>
                <p class="text-sm text-gray-500">{{ component.brand }}</p>
              </div>
            </div>

            <div class="space-y-4">
              <!-- Catégorie -->
              <div>
                <h3 class="text-sm font-medium text-gray-500">Catégorie</h3>
                <p class="mt-1 text-sm text-gray-900">
                  {{ component.category }}
                </p>
              </div>

              <!-- Spécifications -->
              <div>
                <h3 class="text-sm font-medium text-gray-500">Spécifications techniques</h3>
                <div *ngIf="component.specs && objectKeys(component.specs).length > 0" class="mt-2 grid grid-cols-1 md:grid-cols-2 gap-2">
                  <div *ngFor="let key of objectKeys(component.specs)" class="flex items-start">
                    <span class="text-sm font-medium text-gray-700 mr-2">{{ key }}:</span>
                    <span class="text-sm text-gray-900">{{ component.specs[key] }}</span>
                  </div>
                </div>
                <p *ngIf="!component.specs || objectKeys(component.specs).length === 0" class="mt-1 text-sm text-gray-400 italic">
                  Aucune spécification technique définie
                </p>
              </div>
            </div>
          </div>

          <!-- Right Column - Actions -->
          <div class="md:w-64">
            <div class="bg-gray-50 p-4 rounded-lg">
              <h3 class="text-sm font-medium text-gray-500 mb-2">Actions</h3>
              <div class="space-y-2">
                <a [routerLink]="['/admin/composants', component._id, 'modifier']" 
                   class="btn-secondary w-full flex items-center justify-center gap-2">
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                  </svg>
                  Modifier
                </a>
                <button (click)="deleteComponent()" 
                        class="btn-danger w-full flex items-center justify-center gap-2">
                  <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                  </svg>
                  Supprimer
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
</div>
